[project]
name = "promptgram-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "flask>=3.1,<3.2",
  "sqlalchemy>=2.1,<2.2",
  "flask-sqlalchemy>=3.1,<3.2",
  "flask-migrate>=4.1,<5",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.14,<3",
  "gunicorn>=27,<28",
  "flask-login>=0.6.3,<0.7",
  "flask-wtf>=1.3,<1.4",
  "flask-limiter>=4.1,<5",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
