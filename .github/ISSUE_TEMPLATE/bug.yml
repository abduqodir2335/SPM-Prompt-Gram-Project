name: Bug
description: Something does not work as the requirements say
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Name the story and acceptance criterion if you can (for example FR-06 AC2)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Production (server)
        - Local development
        - CI pipeline
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The "version" value of /api/health, or the commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords, cookies and tokens before you paste
